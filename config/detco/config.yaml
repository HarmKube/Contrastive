# Baseline configuration for DETCO training with YOLOv8 backbone
# --------------------------------------------------------------
# Copy this file and override individual values as needed.

# ----------------------------
# Dataset parameters
# ----------------------------
dataset:
  root: "/mydata/pretrain_yt/images"

  # DataLoader-Parameter
  batch_size: 64
  num_workers: 16
  shuffle: true
  persistent_workers: true

  # --------------------------------------------------
  # Augmentations (alles aus AugmentCfg)
  # --------------------------------------------------
  augment:
    input_size_global: 448
    input_size_local: 510
    local_patch_size: 130
    grid_cell_width: 170

# ----------------------------
# Model parameters
# ----------------------------
model:
  yolo_cfg: yolov8n.yaml          # Ultralytics model definition
  backbone_layers: 10             # how many layers to keep as backbone
  checkpoint_path: "./out/detco_pretrain"

# ----------------------------
# Training hyper‑parameters
# ----------------------------
training:
  epochs: 200
  patience: 30
  lr: 0.0002
  weight_decay: 0.0
  temperature: 0.1               # NT‑Xent temperature
  memory_bank_size: [4096, 128]  # [queue_len, feature_dim]
  use_amp: true                  # enable Automatic Mixed Precision
  enable_profiling: false

embedding_eval:
  enabled: false
  img_dir: "path_to/images/train"
  lbl_dir: "path_to/labels/train"
  batch_size: 1
  freq: 1
  top_k_classes: 40
  l2_normalize: true
  metric: "cosine"
  compute_nmi: true
  kmeans_init: "k-means++"  # "random" o. Ä. (Optional)


# ----------------------------
# Misc
# ----------------------------
seed: 42
device: cuda                     # set to 'cpu' to force CPU training
